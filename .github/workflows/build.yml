name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ZayneVideoEditing.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd ZayneVideoEditing && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zayne-APK
          path: ZayneVideoEditing/app/build/outputs/apk/debug/*.apk
